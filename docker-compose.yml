version: "3.9"

services:

  db:
    image: pgvector/pgvector:pg15
    container_name: inshaa_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: inshaa_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  app:
    build: .
    container_name: inshaa
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:admin@db:5432/inshaa_db
    ports:
      - "8003:8000"
    env_file:
      - .env
    volumes:
      - ./app/static:/app/static
volumes:
  postgres_data: