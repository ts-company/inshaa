version: "3.9"

services:

  db:
    image: pgvector/pgvector:pg15
    container_name: inshaa_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups

  app:
    build: .
    container_name: inshaa
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app/static:/app/static
volumes:
  postgres_data: