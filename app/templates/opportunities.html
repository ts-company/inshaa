<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opportunities | Inshaa Minka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #10212E;
      --paper: #F6F3EC;
      --surface: #FFFFFF;
      --steel: #3E5468;
      --steel-dark: #223746;
      --line: #DCE5E9;
      --line-strong: #BED0D7;
      --yellow: #D4A13A;
      --error: #B33A2A;
      --shadow: 0 18px 42px rgba(16, 33, 46, 0.12);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: linear-gradient(180deg, #f9f2e8 0%, #f2f5f7 100%);
      color: var(--ink);
      font-family: 'Barlow', sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }

    h1, h2, h3 {
      font-family: 'Barlow Condensed', sans-serif;
      margin: 0;
      line-height: 1.05;
      color: var(--ink);
    }

    a { color: inherit; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(16, 33, 46, 0.96);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 8px 24px rgba(16, 33, 46, 0.18);
      backdrop-filter: blur(12px);
    }

    .header-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .wordmark {
      display: block;
      width: min(270px, 32vw);
      flex-shrink: 0;
      text-decoration: none;
    }

    .wordmark img {
      display: block;
      width: 100%;
      height: auto;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .header-nav a {
      color: rgba(255,255,255,0.82);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 9px 14px;
      border-radius: 4px;
      border: 1px solid transparent;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .header-nav a:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.2);
      color: #FFFFFF;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 54px 32px 90px;
    }

    .page-intro {
      margin: 0 auto 34px;
      max-width: 720px;
      text-align: center;
    }

    .page-kicker {
      color: var(--steel);
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .page-intro h1 {
      font-size: clamp(38px, 5vw, 64px);
      letter-spacing: 0.4px;
      margin-bottom: 12px;
    }

    .page-intro p {
      color: var(--steel-dark);
      font-size: 17px;
      line-height: 1.7;
    }

    .form-shell {
      background: rgba(255,255,255,0.88);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      max-width: 820px;
      margin: 0 auto;
      padding: 30px;
    }

    form {
      display: grid;
      gap: 18px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 15px;
      font-weight: 600;
      color: var(--steel-dark);
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="number"],
    input[type="file"] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      font: 500 16px 'Barlow', sans-serif;
      color: var(--ink);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="file"] {
      padding: 12px 14px;
      background: #fff;
    }

    input:focus {
      outline: none;
      border-color: var(--steel);
      box-shadow: 0 0 0 4px rgba(62, 84, 104, 0.10);
    }

    .file-field {
      padding: 14px 16px;
      border: 1px dashed var(--line-strong);
      border-radius: 10px;
      background: #fbfcfd;
    }

    .field-hint {
      font-size: 13px;
      color: rgba(34, 55, 70, 0.72);
      font-weight: 500;
    }

    .submit-wrap {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      margin-top: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 22px;
      border: none;
      border-radius: 999px;
      background: var(--ink);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.4px;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease;
      text-decoration: none;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: var(--steel-dark);
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .status-message {
      font-size: 15px;
      font-weight: 600;
      min-height: 24px;
    }

    .status-message.error { color: var(--error); }
    .status-message.success { color: #1f6a3d; }

    @media (max-width: 700px) {
      .header-inner {
        padding: 16px 20px;
        flex-wrap: wrap;
      }

      .header-nav {
        justify-content: flex-start;
      }

      main {
        padding: 36px 20px 70px;
      }

      .field-grid {
        grid-template-columns: 1fr;
      }

      .form-shell {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="wordmark" aria-label="Inshaa Minka home">
        <img src="/static/logo.png" alt="Inshaa Minka Building &amp; Construction">
      </a>

      <nav class="header-nav" aria-label="Main navigation">
        <a href="/">Home</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-intro">
      <p class="page-kicker">Career Opportunities</p>
      <h1>Join our team</h1>
      <p>We are looking for motivated people who want to build with us. Fill out the form below and upload your information.</p>
    </div>

    <div class="form-shell">
      <form id="opportunity-form" action="/home/opportunities/apply" method="post" enctype="multipart/form-data">
        <div class="field-grid">
          <label>
            Full name
            <input type="text" name="name" id="name" required>
          </label>

          <label>
            Email address
            <input type="email" name="email" id="email" required>
          </label>
        </div>

        <div class="field-grid">
          <label>
            Phone number
            <input type="tel" name="phone_number" id="phone_number" required>
          </label>

          <label>
            Age
            <input type="number" name="age" id="age" min="18" required>
          </label>
        </div>

        <label>
          Profile picture
          <input type="file" name="picture" id="picture" accept="image/*" required>
        </label>

        <label>
          CV
          <input type="file" name="cv" id="cv" accept=".pdf,.doc,.docx" required>
        </label>

        <div class="submit-wrap">
          <button type="submit" class="btn">Submit application</button>
          <span class="status-message" id="status-message" aria-live="polite"></span>
        </div>
      </form>
    </div>
  </main>

  <script>
    const opportunityForm = document.getElementById('opportunity-form');
    const statusMessage = document.getElementById('status-message');

    opportunityForm.addEventListener('submit', async function (event) {
      event.preventDefault();

      statusMessage.textContent = '';
      statusMessage.className = 'status-message';

      const formData = new FormData(opportunityForm);
      const submitButton = opportunityForm.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      submitButton.textContent = 'Submitting...';

      try {
        const response = await fetch('/home/opportunities/apply', {
          method: 'POST',
          body: formData,
          credentials: 'include'
        });

        if (!response.ok) {
          const text = await response.text();
          throw new Error(text || 'Something went wrong. Please try again.');
        }

        statusMessage.textContent = 'Your application has been sent successfully.';
        statusMessage.classList.add('success');
        opportunityForm.reset();
      } catch (error) {
        statusMessage.textContent = error.message || 'Something went wrong. Please try again.';
        statusMessage.classList.add('error');
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Submit application';
      }
    });
  </script>
</body>
</html>
