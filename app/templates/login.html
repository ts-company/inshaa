<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>inshaa minka building &amp; constrauction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/static/js/language-toggle.js" defer></script>
<style>
/* ===== Tokens (matches the main site theme) ===== */
:root {
  --ink: #1C1F22;
  --concrete: #E7E2D8;
  --paper: #F6F3EC;
  --steel: #3E5468;
  --steel-dark: #2A3A47;
  --yellow: #F0B429;
  --line: #D8D2C4;
  --line-strong: #B9B2A1;
  --white: #FFFFFF;
  --error: #A2402C;

  --font-head: 'Barlow Condensed', sans-serif;
  --font-body: 'Barlow', sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, rgba(236, 234, 228, 0.94), rgba(246, 243, 236, 0.88)), url('/static/hero.jpg') center center / cover no-repeat fixed;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
}

h1 {
  font-family: var(--font-head);
  font-weight: 600;
  line-height: 1.05;
  margin: 0;
  color: var(--ink);
}

p { margin: 0; }

button { font-family: var(--font-body); cursor: pointer; }

:focus-visible {
  outline: 2px solid var(--steel);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ===== Header ===== */
.site-header {
  border-bottom: 1px solid var(--line-strong);
}

.header-inner {
  max-width: 1180px;
  margin: 0 auto;
  padding: 18px 32px;
}

.wordmark {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-head);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0.2px;
  color: var(--ink);
  text-decoration: none;
}

.wordmark-mark { color: var(--steel); display: flex; }

/* ===== Layout ===== */
.login-main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 64px 32px;
  background: transparent;
}

.login-card {
  width: 100%;
  max-width: 430px;
  padding: 52px 56px;
  background: var(--white);
  box-shadow: 0 24px 70px rgba(28, 31, 34, 0.18);
  text-align: right;
}

.login-kicker {
  font-size: 14px;
  color: #D71920;
  font-weight: 600;
  margin-bottom: 10px;
}

.login-card h1 {
  font-size: 42px;
  margin-bottom: 10px;
}

.login-lede {
  color: var(--steel-dark);
  font-size: 15.5px;
  margin-bottom: 28px;
}

.login-form {
  display: flex;
  flex-direction: column;
  gap: 20px;
  border-top: 3px solid #D71920;
  padding-top: 28px;
}

.login-form label {
  display: flex;
  flex-direction: column;
  gap: 7px;
  font-size: 14px;
  font-weight: 600;
  color: var(--steel-dark);
}

.login-form input {
  font-family: var(--font-body);
  font-size: 15px;
  padding: 13px 14px;
  border: 1px solid #C9C5BB;
  background: #FBFAF7;
  color: var(--ink);
  border-radius: 3px;
  transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}

.login-form input:focus {
  outline: none;
  border-color: #D71920;
  background: var(--white);
  box-shadow: 0 0 0 3px rgba(215, 25, 32, 0.12);
}

.password-field { position: relative; }

.password-field input { width: 100%; padding-right: 46px; }

.password-toggle {
  position: absolute;
  right: 4px;
  top: 4px;
  bottom: 4px;
  width: 40px;
  background: none;
  border: none;
  color: var(--steel-dark);
  font-size: 13px;
  font-weight: 600;
}

.password-toggle:hover { color: var(--ink); }

.btn {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 15px;
  width: 100%;
  padding: 14px 26px;
  border-radius: 3px;
  border: 1.5px solid #D71920;
  background: #D71920;
  color: var(--paper);
  transition: background 0.15s ease, opacity 0.15s ease, transform 0.1s ease;
}

.btn:hover { background: #B9151B; border-color: #B9151B; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.55; cursor: default; transform: none; }

.form-message {
  font-size: 14px;
  font-weight: 600;
  padding: 11px 13px;
  border: 1px solid transparent;
  border-radius: 2px;
}

.form-message[hidden] { display: none; }

.form-message.is-error {
  color: var(--error);
  background: rgba(162, 64, 44, 0.08);
  border-color: rgba(162, 64, 44, 0.3);
}

.form-message.is-success {
  color: var(--steel-dark);
  background: rgba(62, 84, 104, 0.08);
  border-color: rgba(62, 84, 104, 0.3);
}

.login-foot {
  margin-top: 22px;
  font-size: 13.5px;
  color: var(--steel-dark);
}

/* ===== Footer ===== */
.site-footer {
  border-top: 1px solid var(--line-strong);
  padding: 22px 32px;
  text-align: center;
  color: var(--steel-dark);
  font-size: 13.5px;
}
/* Shared public-site header */
.site-header {
  background: #0B4D72;
  border-bottom: 0;
  box-shadow: 0 10px 28px rgba(11, 77, 114, 0.3);
}

.site-header::after {
  content: '';
  display: block;
  height: 5px;
  width: 32%;
  background: #D71920;
}

.header-inner {
  max-width: 1240px;
  min-height: 112px;
  padding: 26px 32px;
}

.wordmark {
  display: block;
  width: min(280px, 100%);
}

.wordmark img {
  display: block;
  width: 100%;
  height: auto;
}

@media (max-width: 640px) {
  .header-inner { min-height: 88px; padding: 20px; }
  .wordmark { width: min(230px, 100%); }
  .login-main { padding: 28px 16px 40px; }
  .login-card { max-width: none; padding: 38px 28px 42px; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand-lockup">
      <div>
        <span class="wordmark" aria-label="Inshaa Minka">
          <img src="/static/logo.png" alt="Inshaa Minka Building &amp; Construction">
        </span>
      </div>
    </div>
  </div>
</header>

<main class="login-main">
  <div class="login-card">
    <h1>تسجيل الدخول</h1>

    <form class="login-form" id="login-form" novalidate>
      <label>
        اسم المستخدم
        <input type="text" name="username" id="username" autocomplete="username" required>
      </label>

      <label>
        كلمة المرور
        <div class="password-field">
          <input type="password" name="password" id="password" autocomplete="current-password" required>
          <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password">Show</button>
        </div>
      </label>

      <p class="form-message" id="form-message" role="alert" hidden></p>

      <button type="submit" class="btn" id="submit-btn">تسجيل الدخول</button>
    </form>

  </div>
</main>

<footer class="site-footer">
  <p>© 2026 Inshaa</p>
</footer>

<script>

const form = document.getElementById('login-form');
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const passwordToggle = document.getElementById('password-toggle');
const submitBtn = document.getElementById('submit-btn');
const messageEl = document.getElementById('form-message');

passwordToggle.addEventListener('click', () => {
  const isHidden = passwordInput.type === 'password';
  passwordInput.type = isHidden ? 'text' : 'password';
  passwordToggle.textContent = isHidden ? 'Hide' : 'Show';
  passwordToggle.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
});

function showMessage(text, type) {
  messageEl.textContent = text;
  messageEl.className = `form-message is-${type}`;
  messageEl.hidden = false;
}

function hideMessage() {
  messageEl.hidden = true;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideMessage();

  const username = usernameInput.value.trim();
  const password = passwordInput.value;

  if (!username || !password) {
    showMessage('Enter your username and password.', 'error');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Signing in…';

  try {
    const res = await fetch('/system/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ username, password }),
    });

    if (!res.ok) {
      const status = Number(res.status);

      if (status === 403) {
        showMessage('You account is deactivated', 'error');
      } else if (status === 404) {
        showMessage('Incorrect username or password.', 'error');
      } else {
        showMessage(`Something went wrong (status ${status}). Try again.`, 'error');
      }

      return;
    }

    showMessage('Signing in');
    setTimeout(() => {
      window.location.href = '/system/dashboard/';
    }, 500);
  } catch (err) {
    showMessage(`Couldn't reach the server (${err.message}). Check your connection and try again.`, 'error');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
